# macOS overlay, the same choice ros/docker/compose.mac.yaml makes for the
# sim: Docker runs in a Linux VM there, so `network_mode: host` reaches only
# the VM, and the sim itself runs on the bridge network. The page joins the
# same bridge (DDS discovery works between two bridge containers) and
# publishes its port so the browser on the Mac reaches it. run.sh adds this
# file on Darwin; Linux keeps host networking next to the sim.
services:
  wojtek_vlm_gui:
    network_mode: bridge
    ports:
      - "8501:8501"
