# Robot-local overrides for wojtek-robot.service, installed by install.sh
# (phase 5) as /etc/systemd/system/wojtek-robot.service.d/10-local.conf on
# every provision. Differences from the base unit's ExecStart:
#
#   * boot_pose:=folded -- the robot starts lying folded (knees on the
#     mechanical stop); real_io computes encoder offsets at service start
#     assuming that pose. Pose the robot BEFORE starting/restarting the
#     service, or re-zero with /wojtek/zero afterwards.
#   * bag:=false -- the always-on rosbag (400 Hz introspection to the SD
#     card) starved the Pi 3's cores and broke the policy's freshness
#     watchdog. Record on demand instead.
#   * policy:=/home/rpi/policy -- a stable local reference instead of a
#     Hugging Face id: the robot needs no network and no HF_ORGANIZATION.
#     Deploying a policy is a config change done by hand (current default
#     on the robot: wojtek_flat_quiet_baseacc_s0):
#         rsync -a training/runs/wojtek_flat_quiet_baseacc_s0/deploy/ \
#             rpi@10.42.0.2:policies/wojtek_flat_quiet_baseacc_s0/
#         ssh rpi@10.42.0.2 'ln -sfn /home/rpi/policies/wojtek_flat_quiet_baseacc_s0 /home/rpi/policy'
#         ssh rpi@10.42.0.2 'sudo systemctl restart wojtek-robot.service'
#   * IMU and leg odometry ON (the launch defaults). The IMU's I2C lead to
#     the Pi header came loose once on 2026-09-26 while the CAN connector
#     next to it was reseated: the controller manager then aborts on "imu
#     to active" before it even reaches the drives, and the fallback is
#     use_imu:=false leg_odom:=false here (no IMU, no odometry, the robot
#     still walks). Re-measured the same evening after a reseat: 8313 raw
#     I2C reads in 90 s with zero errors. Strain-relieve that lead.
#   * nav:=true nav_costmap:=false -- goto alone (wojtek_nav): a setpoint on
#     wojtek/nav/goal in odom -> /cmd_vel. Perception and the VLM brain
#     live on a second computer (a second Pi carries the camera, a DGX on
#     the table runs the model) and hand this one the goal points, so no
#     camera chain and no costmap here; goto treats a missing grid as free.
#   * perception:=false, no deck -- the RealSense driver, the deck gateway
#     and its JPEG encoder together pushed the Pi 4 to a load average of
#     16 and the leg odometry down to 8 Hz. Off until the power supply
#     and the core budget are sorted out.
#   * max_torque:=6 -- half the contract's cap. The Pi's 5 V rail browned
#     out six times that day, once 4 s after a stand-up; a lower cap
#     shrinks the load step until the supply is fixed.
#   * telemetry:=true foxglove:=true -- the bridge on port 8765 and the
#     sysinfo/policy_timing topics, so a run is watchable from a PC. The
#     sysinfo throttle word is the first place a brown-out shows.
#
# Restarting by hand: the CM watchdog stops a service whose controller
# manager it cannot see, and it polls every 10 s without a grace period
# for a process that has not spawned yet, so a bare `systemctl restart`
# can be killed ~8 s in. Pause the watchdog around a manual restart:
#     sudo systemctl stop wojtek-cm-watchdog && sudo systemctl restart wojtek-robot && sudo systemctl start wojtek-cm-watchdog
[Service]
ExecStart=
ExecStart=/usr/bin/taskset -c 2,3 /bin/bash -lc 'source /opt/ros/jazzy/setup.bash && source /home/rpi/wojtek_ws/install/setup.bash && exec ros2 launch wojtek_bringup robot.launch.py boot_pose:=folded control_cpus:=3 policy_cpus:=2 perception:=false nav:=true nav_costmap:=false max_torque:=6 policy:=/home/rpi/policy gamepad:=true gamepad_cpus:=0,1 bag:=false bag_cpus:=0,1 telemetry:=true foxglove:=true foxglove_cpus:=0,1'
